name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["redesign-oct30"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare complete static frontend
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          # The production homepage is the root index.html. Its client-side game files live in web/.
          cp -a web/. _site/
          git show HEAD:index.html > _site/index.html
          touch _site/.nojekyll

          # GitHub project Pages is hosted under /igi2977/, not the domain root.
          # Rewrite only local root-relative URLs in the generated copy. Absolute external
          # URLs (https://...), canonical/SEO URLs, and the repository source stay unchanged.
          python3 - <<'PY'
          from pathlib import Path
          import re

          extensions = {".html", ".htm", ".css", ".js", ".mjs", ".json", ".webmanifest", ".xml"}
          quote_root = re.compile(r"""(["'\`])/(?![/'\`"])""")
          css_root = re.compile(r"""(url\(\s*)/(?!/)""")

          for path in Path("_site").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              try:
                  source = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = quote_root.sub(r"\1/igi2977/", source)
              updated = css_root.sub(r"\1/igi2977/", updated)
              if updated != source:
                  path.write_text(updated, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
