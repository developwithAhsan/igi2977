name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["redesign-oct30"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll
          # GitHub project pages live under /igi2977/, unlike the original root domain.
          # Adjust only the generated copy; repository source files remain unchanged.
          find _site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.webmanifest' \) -print0 | while IFS= read -r -d '' file; do
            sed -i \
              -e 's|="/web/|="/igi2977/web/|g' \
              -e "s|='/web/|='/igi2977/web/|g" \
              -e 's|url(/web/|url(/igi2977/web/|g' \
              -e 's|="/logo.png|="/igi2977/logo.png|g' \
              -e 's|="/site.webmanifest|="/igi2977/site.webmanifest|g' \
              -e 's|="/og-project-igi.png|="/igi2977/og-project-igi.png|g' \
              "$file"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
