name: Deploy Project IGI to GitHub Pages

on:
  push:
    branches: ["redesign-oct30"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          # Copy browser runtime and page files without overwriting the newer root homepage/CSS.
          rsync -a --ignore-existing web/ _site/
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          import shutil

          site = Path("_site")
          home = site / "index.html"
          if not home.is_file():
              raise SystemExit("Root index.html is missing.")

          # Make extensionless routes work on GitHub Pages (which is static-only).
          # Keep the original .html files too, so existing direct links continue to work.
          for page in site.glob("*.html"):
              if page.name in {"index.html", "404.html"}:
                  continue
              route = site / page.stem / "index.html"
              route.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(page, route)

          blogs = site / "blogs"
          if (blogs / "index.html").is_file():
              blog_route = site / "blog"
              blog_route.mkdir(parents=True, exist_ok=True)
              shutil.copy2(blogs / "index.html", blog_route / "index.html")
              for page in blogs.glob("*.html"):
                  if page.name == "index.html":
                      continue
                  route = site / "blog" / page.stem / "index.html"
                  route.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(page, route)

          # The repository has a custom-domain CNAME. On that domain assets belong
          # at "/", not "/igi2977/". Use the project subpath only as a fallback
          # if the CNAME file is ever removed.
          cname = site / "CNAME"
          base_path = "" if cname.is_file() and cname.read_text(encoding="utf-8").strip() else "/igi2977"

          # Inline the exact current root homepage styles so the homepage cannot
          # lose its layout because a stylesheet URL fails during the first load.
          html = home.read_text(encoding="utf-8")
          css_names = {"redesign.css", "igi-theme.css", "home-embed.css"}
          inlined = set()

          def inline_site_css(match):
              tag = match.group(0)
              href = re.search(r"""href\s*=\s*["']([^"']+)["']""", tag, re.I)
              rel = re.search(r"""rel\s*=\s*["']([^"']+)["']""", tag, re.I)
              if not href or not rel:
                  return tag
              name = Path(urlsplit(href.group(1)).path).name
              if name not in css_names:
                  return tag
              rel_value = rel.group(1).lower()
              if "preload" in rel_value:
                  return ""
              if "stylesheet" not in rel_value:
                  return tag
              css_path = site / name
              if not css_path.is_file():
                  raise SystemExit(f"Required homepage stylesheet is missing: {css_path}")
              css = css_path.read_text(encoding="utf-8").replace("</style", "<\\/style")
              inlined.add(name)
              return f'<style data-inline-source="{name}">\n{css}\n</style>'

          html = re.sub(r"<link\b[^>]*>", inline_site_css, html, flags=re.I)
          missing_css = css_names - inlined
          if missing_css:
              raise SystemExit("Homepage CSS was not inlined: " + ", ".join(sorted(missing_css)))

          # Rewrite only local root-relative URLs in the generated copy when using
          # the github.io project URL. Absolute SEO/canonical URLs stay untouched.
          def apply_base(source):
              if not base_path:
                  return source
              quote_root = re.compile(r"""(["'])/(?!/)(?!igi2977/)(?=[A-Za-z0-9_.~-])""")
              css_root = re.compile(r"""(url\(\s*)/(?!/)""")
              source = quote_root.sub(lambda m: m.group(1) + base_path + "/", source)
              source = re.sub(r"""((?:href|src|action|poster)=["'])/(["'])""", lambda m: m.group(1) + base_path + "/" + m.group(2), source, flags=re.I)
              source = css_root.sub(lambda m: m.group(1) + base_path + "/", source)
              return source

          home.write_text(apply_base(html), encoding="utf-8")

          # Rewrite other static HTML/CSS/JS/manifest/XML files in the output copy.
          text_exts = {".html", ".htm", ".css", ".js", ".mjs", ".json", ".webmanifest", ".xml"}
          for file in site.rglob("*"):
              if not file.is_file() or file == home or file.suffix.lower() not in text_exts:
                  continue
              try:
                  source = file.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = apply_base(source)
              if updated != source:
                  file.write_text(updated, encoding="utf-8")

          required = [
              "index.html", "logo.png", "loader.js", "controls.js", "touch.js",
              "netplay.js", "redesign-ui.js", "web/game-source.js",
              "build/recomp.js", "build/recomp.wasm",
              "about/index.html", "play/index.html", "controls/index.html",
              "faq/index.html", "blog/index.html", ".nojekyll"
          ]
          missing = [name for name in required if not (site / name).is_file()]
          if missing:
              raise SystemExit("Required Pages files missing: " + ", ".join(missing))

          if (site / "build/recomp.wasm").stat().st_size < 1024:
              raise SystemExit("build/recomp.wasm is unexpectedly small.")

          print("Custom domain base path:", "root" if not base_path else base_path)
          print("Homepage CSS embedded:", ", ".join(sorted(inlined)))
          print("Static page routes and game runtime files verified.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
