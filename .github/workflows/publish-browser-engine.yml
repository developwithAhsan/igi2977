name: Publish compiled browser engine

on:
  push:
    branches:
      - redesign-oct30
    paths:
      - .github/workflows/publish-browser-engine.yml

permissions:
  contents: write

concurrency:
  group: publish-igi-engine-redesign-oct30
  cancel-in-progress: false

jobs:
  publish-engine:
    if: contains(github.event.head_commit.message, '[engine-artifacts-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out existing project branch
        uses: actions/checkout@v4
        with:
          ref: redesign-oct30
          persist-credentials: true

      - name: Download and validate compiled engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/build
          curl --fail --silent --show-error --location --retry 3 \
            https://sb-3p7wl7abz7a2.vercel.run/build/recomp.js \
            --output web/build/recomp.js
          curl --fail --silent --show-error --location --retry 3 \
            https://sb-3p7wl7abz7a2.vercel.run/build/recomp.wasm \
            --output /tmp/recomp.wasm
          test -s web/build/recomp.js
          test -s /tmp/recomp.wasm
          node --check web/build/recomp.js
          gzip --best --stdout /tmp/recomp.wasm > web/build/recomp.wasm
          gzip --test web/build/recomp.wasm
          echo "Browser JavaScript: $(stat -c '%s bytes' web/build/recomp.js)"
          echo "Compressed WebAssembly: $(stat -c '%s bytes' web/build/recomp.wasm)"
          sha256sum web/build/recomp.js web/build/recomp.wasm

      - name: Configure WebAssembly response headers
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("vercel.json")
          config = json.loads(path.read_text())
          wasm_sources = {"/build/recomp.wasm", "/web/build/recomp.wasm"}
          config["headers"] = [
              item for item in config.get("headers", [])
              if item.get("source") not in wasm_sources
          ]
          for source in sorted(wasm_sources):
              config["headers"].append({
                  "source": source,
                  "headers": [
                      {"key": "Content-Type", "value": "application/wasm"},
                      {"key": "Content-Encoding", "value": "gzip"},
                      {"key": "Cache-Control", "value": "public, max-age=31536000, immutable"}
                  ]
              })
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY

      - name: Commit engine files to the same branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/build/recomp.js web/build/recomp.wasm vercel.json
          git diff --cached --check
          git commit -m "Publish compiled Project IGI browser engine"
          git push origin HEAD:redesign-oct30
