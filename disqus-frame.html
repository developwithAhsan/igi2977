<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<title>Project I.G.I. Community Comments</title>
<script>
try {
  if (new URLSearchParams(location.search).get('page') === 'home') {
    document.documentElement.classList.add('home-comments');
  }
} catch (_) {}
</script>
<style>
  :root{color-scheme:light;font:15px/1.5 Inter,system-ui,sans-serif;background:#fff;color:#596579}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#fff;color:#596579}
  body{padding:8px}
  #disqus-status{margin:8px 0 12px;padding:10px 12px;border:1px solid #d8e2dc;border-radius:8px;font-size:13px}
  #disqus-status a{color:#2f7d32;font-weight:700}
  #disqus_thread{min-height:180px;width:100%;background:#fff;color:#596579}
  #disqus_thread a{color:#2f7d32}
  html.home-comments,html.home-comments body{color-scheme:dark;background:transparent;color:#a9dbb6}
  html.home-comments body{padding:0;font:13px/1.6 "IBM Plex Mono",ui-monospace,monospace}
  html.home-comments #disqus-status{border-color:rgba(117,249,155,.25);background:rgba(0,0,0,.18);color:#a9dbb6}
  html.home-comments #disqus-status a{color:#75f99b}
  html.home-comments #disqus_thread{background:transparent;color:#a9dbb6}
  html.home-comments #disqus_thread a{color:#75f99b}
</style>
</head>
<body>
<p id="disqus-status" role="status" aria-live="polite">Connecting to the discussion…</p>
<div id="disqus_thread"></div>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var homeThread = params.get('page') === 'home';
  var status = document.getElementById('disqus-status');
  var thread = document.getElementById('disqus_thread');
  var ready = false;
  var lastHeight = 0;
  var resizeQueued = false;
  var pageUrl = homeThread ? 'https://project-igi.online/' : 'https://project-igi.online/play';
  var pageTitle = homeThread
    ? 'Project I.G.I. Online — Home Discussion'
    : 'Project I.G.I. Online — Community Discussion';

  function signal(type, extra) {
    var payload = Object.assign({ type: type }, extra || {});
    try { parent.postMessage(payload, location.origin); } catch (_) {}
  }

  function setStatus(message, withLink) {
    status.textContent = message + (withLink ? ' ' : '');
    if (withLink) {
      var link = document.createElement('a');
      link.href = 'https://igi-3.disqus.com/';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'Open Disqus';
      status.appendChild(link);
    }
  }

  function sendHeight() {
    resizeQueued = false;
    var height = Math.ceil(Math.max(
      document.documentElement.scrollHeight,
      document.body.scrollHeight,
      thread.scrollHeight
    ));
    if (height === lastHeight) return;
    lastHeight = height;
    signal('igi-disqus-height', { height: height });
  }

  function queueHeight() {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(sendHeight);
  }

  function markReady() {
    if (ready) return;
    ready = true;
    status.hidden = true;
    signal('igi-disqus-ready');
    queueHeight();
  }

  // Preserve the existing URL-based thread identifiers to keep all existing comments.
  window.disqus_config = function () {
    this.page.url = pageUrl;
    this.page.identifier = pageUrl;
    this.page.title = pageTitle;
    this.callbacks = this.callbacks || {};
    this.callbacks.onReady = function () { markReady(); };
  };

  var script = document.createElement('script');
  script.src = 'https://igi-3.disqus.com/embed.js';
  script.async = true;
  script.onload = function () { queueHeight(); };
  script.onerror = function () {
    if (ready) return;
    setStatus('Disqus could not be loaded. Check network filtering or browser extensions, or visit the forum directly:', true);
    signal('igi-disqus-error', { message: 'Disqus could not be loaded. Open the discussion directly:' });
    queueHeight();
  };
  script.setAttribute('data-timestamp', String(Date.now()));
  (document.head || document.body).appendChild(script);

  // Detect a real Disqus interface even if its optional onReady callback is unavailable.
  if ('MutationObserver' in window) {
    var observer = new MutationObserver(function () {
      if (thread.querySelector('iframe, .post-list, .textarea-wrapper, .publisher-anchor-color')) {
        markReady();
        observer.disconnect();
      }
      queueHeight();
    });
    observer.observe(thread, { childList: true, subtree: true, attributes: true });
  }

  if ('ResizeObserver' in window) new ResizeObserver(queueHeight).observe(document.body);
  window.addEventListener('load', queueHeight);
  queueHeight();

  window.setTimeout(function () {
    if (ready) return;
    setStatus('Comments are taking too long to connect. Check whether Disqus is blocked, or open the forum directly:', true);
    signal('igi-disqus-error', { message: 'Comments are taking too long to connect. Open the discussion directly:' });
    queueHeight();
  }, 30000);
})();
</script>
</body>
</html>
